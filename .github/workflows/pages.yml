name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare site
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude=.github --exclude=.gitignore
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          token = os.environ["MAPBOX_PUBLIC_TOKEN"]
          if not re.fullmatch(r"pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", token):
              raise SystemExit("Set MAPBOX_PUBLIC_TOKEN to a public Mapbox access token.")

          page = Path("_site/little-dribbling/index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("__MAPBOX_PUBLIC_TOKEN__", token)
          html = html.replace("data-mapbox-only hidden", "data-mapbox-only")
          html = html.replace("data-mapbox-fallback ", "data-mapbox-fallback hidden ")
          page.write_text(html, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
